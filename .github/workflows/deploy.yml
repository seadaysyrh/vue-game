# main に push したら、ビルドして GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub の画面から手で動かすこともできる

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったら、古いほうは取りやめる
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # https://ユーザー名.github.io/リポジトリ名/ に置かれるので、そのフォルダ名を渡してビルドする
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages は「ない URL でも index.html を返す」設定ができない。
      # 404.html として同じものを置いて、/game や /docs を直接開いても動くようにする
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
